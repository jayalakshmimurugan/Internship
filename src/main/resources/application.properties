spring.application.name=FirstCode
server.port=8081

# MongoDB Configuration with 2000ms server selection timeout for rapid offline fallback
spring.data.mongodb.uri=mongodb://localhost:27017/college?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000
spring.data.mongodb.auto-index-creation=false

# Logging
logging.level.com.example.FirstCode=INFO
logging.level.org.springframework.web=INFO