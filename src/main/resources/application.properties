spring.application.name=FirstCode
server.port=8081

# Relational Database DataSource Configuration (H2)
spring.datasource.url=jdbc:h2:mem:college;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate DDL Configuration (Schema managed by ddl config)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.example.FirstCode=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO